<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกข้อมูลสุขภาพชุมชน (อสม.)</title>

    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            min-height: 100vh;
            background:
                radial-gradient(circle at 12% 18%, rgba(56, 189, 248, 0.46), transparent 32%),
                radial-gradient(circle at 88% 12%, rgba(244, 114, 182, 0.38), transparent 30%),
                radial-gradient(circle at 82% 82%, rgba(167, 139, 250, 0.4), transparent 34%),
                radial-gradient(circle at 18% 88%, rgba(52, 211, 153, 0.36), transparent 32%),
                linear-gradient(135deg, #eff6ff 0%, #fdf2f8 42%, #f5f3ff 70%, #ecfdf5 100%);
            background-size: 140% 140%, 145% 145%, 150% 150%, 155% 155%, 200% 200%;
            animation: bgMove 16s ease-in-out infinite;
            position: relative;
            overflow-x: hidden;
            isolation: isolate;
        }
        @keyframes bgMove {
            0%, 100% { background-position: 0% 20%, 100% 0%, 100% 100%, 0% 100%, 0% 50%; }
            50% { background-position: 18% 32%, 82% 18%, 80% 82%, 22% 76%, 100% 50%; }
        }
        .bg-blob {
            position: fixed;
            filter: blur(90px);
            z-index: -1;
            opacity: 0.48;
            pointer-events: none;
            will-change: transform;
            animation: floatBlob 14s ease-in-out infinite alternate;
        }
        @keyframes floatBlob {
            0% { transform: translate3d(-3vw, -2vh, 0) scale(0.95) rotate(0deg); }
            50% { transform: translate3d(12vw, 10vh, 0) scale(1.18) rotate(12deg); }
            100% { transform: translate3d(4vw, 24vh, 0) scale(1.05) rotate(-8deg); }
        }

        /* Pastel glass surface system (เหมือนหน้าพยาบาล) */
        .app-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.82), rgba(248, 250, 255, 0.66));
            border-color: rgba(255, 255, 255, 0.78);
            box-shadow:
                0 20px 50px rgba(99, 102, 241, 0.12),
                0 8px 24px rgba(56, 189, 248, 0.09),
                inset 0 1px 0 rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        /* Supporting info box */
        .info-panel {
            background: linear-gradient(145deg, rgba(238, 242, 255, 0.68), rgba(240, 253, 250, 0.58));
            border-color: rgba(199, 210, 254, 0.65);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
        }

        /* Form controls */
        input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([readonly]),
        select {
            color: #334155;
            background-color: rgba(255, 255, 255, 0.72);
            border-color: rgba(165, 180, 252, 0.66);
            box-shadow:
                inset 0 1px 2px rgba(79, 70, 229, 0.04),
                0 4px 12px rgba(99, 102, 241, 0.05);
            transition: border-color 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
        }
        input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([readonly]):hover,
        select:hover:not(:disabled) {
            background-color: rgba(255, 255, 255, 0.88);
            border-color: rgba(129, 140, 248, 0.78);
        }
        input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([readonly]):focus,
        select:focus {
            outline: none;
            background-color: rgba(255, 255, 255, 0.94);
            border-color: #818cf8;
            box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.16), 0 8px 20px rgba(99, 102, 241, 0.09);
        }
        select:disabled {
            background-color: rgba(241, 245, 249, 0.6);
            border-color: rgba(203, 213, 225, 0.65);
            color: #94a3b8;
            cursor: not-allowed;
        }

        /* Buttons */
        .btn-secondary {
            color: #475569;
            background: linear-gradient(135deg, rgba(241, 245, 249, 0.92), rgba(238, 242, 255, 0.92));
            border: 1px solid rgba(199, 210, 254, 0.65);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.12);
            transition: all 180ms ease;
        }
        .btn-secondary:hover {
            background: linear-gradient(135deg, #e9eef8, #e7e7fb);
            transform: translateY(-1px);
        }

        .btn-primary-emerald {
            background: linear-gradient(135deg, #10b981, #059669);
            border: 1px solid rgba(167, 243, 208, 0.5);
            box-shadow: 0 10px 24px rgba(5, 150, 105, 0.22);
            transition: all 180ms ease;
        }
        .btn-primary-emerald:hover:not(:disabled) {
            background: linear-gradient(135deg, #0da875, #047d5b);
            box-shadow: 0 13px 28px rgba(5, 150, 105, 0.28);
            transform: translateY(-1px);
        }
        .btn-primary-emerald:active {
            transform: translateY(0);
        }

        /* Mobile touch ergonomics */
        @media (max-width: 639px) {
            body {
                padding-bottom: 1rem;
            }
            .app-shell {
                padding: 0.75rem;
                padding-top: 1rem;
            }
            .app-card {
                padding: 1.15rem;
                border-radius: 1.25rem;
                margin-bottom: 1rem;
            }
            button,
            .btn-secondary {
                min-height: 44px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }
            input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([readonly]),
            select {
                min-height: 44px;
                font-size: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body,
            .bg-blob {
                animation: none;
            }
        }
    </style>
</head>
<body class="min-h-screen text-slate-900 pb-12">

    <!-- พื้นหลังลูกเล่นเรืองแสง (เหมือนหน้าพยาบาล) -->
    <div class="bg-blob bg-blue-300 w-96 h-96 rounded-full top-10 left-10"></div>
    <div class="bg-blob bg-emerald-300 w-96 h-96 rounded-full bottom-10 right-10" style="animation-delay: -5s;"></div>

    <div class="app-shell max-w-3xl mx-auto px-4 py-6 relative z-10">
        <!-- Header -->
        <header class="app-card bg-white/85 backdrop-blur-md rounded-3xl shadow-lg border border-white/60 p-6 mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-emerald-700">🏥 ระบบบันทึกข้อมูลสุขภาพ อสม.</h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-0.5">
                    รอบเดือน: <span id="activeMonthDisplay" class="font-bold text-indigo-600">กำลังโหลด...</span>
                </p>
            </div>
            <div class="w-full sm:w-auto">
                <a href="nurse.html" class="btn-secondary w-full sm:w-auto px-4 py-2.5 rounded-2xl text-sm font-bold text-center">
                    🔒 โซนพยาบาล
                </a>
            </div>
        </header>

        <!-- ฟอร์มบันทึกข้อมูล -->
        <main id="healthForm" class="app-card bg-white/85 backdrop-blur-md rounded-3xl shadow-lg border border-white/60 p-6 sm:p-8">
            <form onsubmit="saveData(event)" class="space-y-5">
                
                <!-- เลือกหมู่บ้านและรายชื่อ -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">🏘️ เลือกหมู่ที่ *</label>
                        <select id="selectVillage" onchange="filterPatientsByVillage()" class="w-full border-2 rounded-2xl p-3 text-sm font-medium">
                            <option value="" disabled selected>-- 🏘️ กำลังโหลดข้อมูลหมู่... --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">👤 เลือกชื่อ - นามสกุล *</label>
                        <select id="selectPatient" onchange="autoFillPatientData()" disabled class="w-full border-2 rounded-2xl p-3 text-sm font-medium">
                            <option value="" disabled selected>-- 👤 กรุณาเลือกหมู่ก่อน --</option>
                        </select>
                    </div>
                </div>

                <!-- ข้อมูลอัตโนมัติ -->
                <div class="info-panel grid grid-cols-1 sm:grid-cols-3 gap-3 p-4 rounded-2xl border">
                    <div>
                        <label class="block text-[11px] font-bold text-indigo-500/80">🪪 เลขบัตรประชาชน (PID)</label>
                        <input type="text" id="idCard" readonly placeholder="-" class="w-full bg-transparent text-sm font-semibold text-slate-800 outline-none mt-0.5">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-indigo-500/80">🎂 อายุ (ปี)</label>
                        <input type="text" id="age" readonly placeholder="-" class="w-full bg-transparent text-sm font-semibold text-slate-800 outline-none mt-0.5">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-indigo-500/80">📍 ที่อยู่ (หมู่/ตำบล)</label>
                        <input type="text" id="villageAndSubdistrict" readonly placeholder="-" class="w-full bg-transparent text-sm font-semibold text-slate-800 outline-none mt-0.5">
                    </div>
                    <div class="sm:col-span-3 pt-1 border-t border-indigo-200/40">
                        <label class="block text-[11px] font-bold text-indigo-500/80">🏠 บ้านเลขที่</label>
                        <input type="text" id="houseNo" readonly placeholder="-" class="w-full bg-transparent text-sm font-semibold text-slate-800 outline-none mt-0.5">
                    </div>
                </div>

                <!-- ช่องกรอกข้อมูลสุขภาพ -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">⚖️ น้ำหนัก (กก.) *</label>
                        <input type="number" step="0.1" id="weight" placeholder="เช่น 60.5" required class="w-full border-2 rounded-2xl p-3 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">📏 ส่วนสูง (ซม.) *</label>
                        <input type="number" id="height" placeholder="เช่น 170" required class="w-full border-2 rounded-2xl p-3 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">❤️ ความดัน ครั้งที่ 1 (BP1) *</label>
                        <input type="text" id="bp1" placeholder="เช่น 120/80" required class="w-full border-2 rounded-2xl p-3 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">💓 ความดัน ครั้งที่ 2 (BP2) *</label>
                        <input type="text" id="bp2" placeholder="เช่น 120/80" required class="w-full border-2 rounded-2xl p-3 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">🩺 ชีพจร (ครั้ง/นาที) *</label>
                        <input type="number" id="pulse" placeholder="เช่น 75" required class="w-full border-2 rounded-2xl p-3 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">🩸 น้ำตาลในเลือด (FBS)</label>
                        <input type="text" id="fbs" placeholder="เช่น 100 (หากไม่ได้ตรวจปล่อยว่างไว้)" class="w-full border-2 rounded-2xl p-3 text-sm">
                    </div>
                </div>

                <!-- พฤติกรรมสุขภาพ -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">🚬 สูบบุหรี่</label>
                        <select id="smoking" class="w-full border-2 rounded-2xl p-3 text-sm font-medium">
                            <option value="ไม่สูบ">ไม่สูบ</option>
                            <option value="สูบเป็นครั้งคราว">สูบเป็นครั้งคราว</option>
                            <option value="สูบเป็นประจำ">สูบเป็นประจำ</option>
                            <option value="เลิกสูบแล้ว">เลิกสูบแล้ว</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">🍺 ดื่มสุรา</label>
                        <select id="drinking" class="w-full border-2 rounded-2xl p-3 text-sm font-medium">
                            <option value="ไม่ดื่ม">ไม่ดื่ม</option>
                            <option value="ดื่มเป็นครั้งคราว">ดื่มเป็นครั้งคราว</option>
                            <option value="ดื่มเป็นประจำ">ดื่มเป็นประจำ</option>
                            <option value="เลิกดื่มแล้ว">เลิกดื่มแล้ว</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="btnSubmit" class="btn-primary-emerald w-full text-white py-4 rounded-2xl font-bold cursor-pointer text-base">
                    💾 บันทึกข้อมูลเข้า Cloud
                </button>
            </form>
        </main>
    </div>

    <script>
        // ฟังก์ชันเสริมใน script.js สำหรับเติมอิโมจิใน dropdown รายชื่อและหมู่บ้านอัตโนมัติ
        document.addEventListener("DOMContentLoaded", () => {
            const originalPopulate = window.populateVillageDropdown;
            if (window.populateVillageDropdown) {
                window.populateVillageDropdown = function() {
                    originalPopulate();
                    const villageSelect = document.getElementById('selectVillage');
                    if (villageSelect) {
                        for (let opt of villageSelect.options) {
                            if (!opt.text.includes("🏘️") && !opt.disabled) {
                                opt.text = "🏘️ " + opt.text;
                            }
                        }
                    }
                };
            }

            const originalFilter = window.filterPatientsByVillage;
            if (window.filterPatientsByVillage) {
                window.filterPatientsByVillage = function() {
                    originalFilter();
                    const patientSelect = document.getElementById('selectPatient');
                    if (patientSelect) {
                        for (let opt of patientSelect.options) {
                            if (!opt.text.includes("👤") && !opt.disabled) {
                                opt.text = "👤 " + opt.text;
                            }
                        }
                    }
                };
            }
        });
    </script>
    <script src="script.js?v=2"></script>
</body>
</html>
