<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกข้อมูลสุขภาพชุมชน (อสม.)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900 pb-12">

    <div class="max-w-5xl mx-auto px-4 py-6">
        <header class="bg-white rounded-3xl shadow-md border border-slate-200 p-6 mb-6 flex flex-col gap-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold text-blue-700">🏥 ระบบบันทึกสุขภาพชุมชน (อสม.)</h1>
                    <p class="text-sm sm:text-base text-slate-600 mt-1">กรอกข้อมูลสุขภาพประชาชนรายบุคคล ตัวหนังสือใหญ่อ่านง่าย</p>
                </div>
                <div class="flex flex-col items-end gap-2">
                    <div class="bg-blue-50 border-2 border-blue-200 px-4 py-2.5 rounded-2xl text-blue-800 text-sm sm:text-base font-bold shadow-xs flex items-center gap-2">
                        📅 รอบบันทึก: <span id="activeMonthDisplay">กำลังโหลด...</span>
                        <button onclick="loadAndRenderActiveMonth()" class="text-xs bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded-lg transition ml-2 cursor-pointer">🔄 อัปเดต</button>
                    </div>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3 bg-slate-200 p-1.5 rounded-2xl">
                <a href="asom.html" class="py-3 rounded-xl font-bold text-base text-center transition bg-white text-blue-700 shadow-sm">📝 แบบฟอร์มบันทึก</a>
                <a href="nurse.html" class="py-3 rounded-xl font-bold text-base text-center transition text-slate-700 hover:text-slate-900">🔒 โซนพยาบาล</a>
            </div>
        </header>

        <main class="bg-white rounded-3xl shadow-md border border-slate-200 p-6 sm:p-8">
            <form id="healthForm" onsubmit="saveData(event)" class="space-y-6">
                <div>
                    <h3 class="text-lg sm:text-xl font-bold text-slate-900 mb-5 border-b pb-3 flex items-center gap-2">
                        🩺 กรอกข้อมูลสุขภาพรายบุคคล
                    </h3>
                    
                    <div class="space-y-5 mb-6">
                        <div>
                            <label class="block text-base sm:text-lg font-bold text-slate-800 mb-2">1. เลือกหมู่ที่ *</label>
                            <select id="selectVillage" onchange="filterPatientsByVillage()" class="w-full border-2 border-slate-300 rounded-2xl p-4 bg-white text-base sm:text-lg text-slate-900 font-medium focus:ring-2 focus:ring-blue-600 outline-none">
                                <option value="" disabled selected>-- กรุณาเลือกหมู่ที่ --</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-base sm:text-lg font-bold text-slate-800 mb-2">2. ชื่อ - นามสกุล ประชาชน *</label>
                            <select id="selectPatient" onchange="autoFillPatientData()" class="w-full border-2 border-slate-300 rounded-2xl p-4 bg-white text-base sm:text-lg text-slate-900 font-medium focus:ring-2 focus:ring-blue-600 outline-none" disabled>
                                <option value="" disabled selected>-- กรุณาเลือกหมู่ก่อน --</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6 bg-slate-50 p-5 rounded-2xl border border-slate-200">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">เลขบัตรประชาชน (PID)</label>
                            <input type="text" id="idCard" readonly class="w-full bg-white border-2 border-slate-200 rounded-xl p-3 text-sm sm:text-base text-slate-700 font-medium">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">อายุ (ปี)</label>
                            <input type="text" id="age" readonly class="w-full bg-white border-2 border-slate-200 rounded-xl p-3 text-sm sm:text-base text-slate-700 font-medium">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">บ้านเลขที่</label>
                            <input type="text" id="houseNo" readonly class="w-full bg-white border-2 border-slate-200 rounded-xl p-3 text-sm sm:text-base text-slate-700 font-medium">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">หมู่ / ตำบล</label>
                            <input type="text" id="villageAndSubdistrict" readonly class="w-full bg-white border-2 border-slate-200 rounded-xl p-3 text-sm sm:text-base text-slate-700 font-medium">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
                        <div>
                            <label class="block text-base font-bold text-slate-800 mb-2">⚖️ น้ำหนัก (กก.)</label>
                            <input type="number" step="0.1" id="weight" placeholder="0.0" class="w-full border-2 border-slate-300 rounded-2xl p-3.5 text-base sm:text-lg font-medium placeholder:text-slate-400 outline-none focus:border-blue-600">
                        </div>
                        <div>
                            <label class="block text-base font-bold text-slate-800 mb-2">📏 ส่วนสูง (ซม.)</label>
                            <input type="number" id="height" placeholder="0" class="w-full border-2 border-slate-300 rounded-2xl p-3.5 text-base sm:text-lg font-medium placeholder:text-slate-400 outline-none focus:border-blue-600">
                        </div>
                        <div>
                            <label class="block text-base font-bold text-slate-800 mb-2">❤️ ความดัน ครั้งที่ 1</label>
                            <input type="text" id="bp1" placeholder="120/80" class="w-full border-2 border-slate-300 rounded-2xl p-3.5 text-base sm:text-lg font-medium placeholder:text-slate-400 outline-none focus:border-blue-600">
                        </div>
                        <div>
                            <label class="block text-base font-bold text-slate-800 mb-2">❤️ ความดัน ครั้งที่ 2</label>
                            <input type="text" id="bp2" placeholder="118/78" class="w-full border-2 border-slate-300 rounded-2xl p-3.5 text-base sm:text-lg font-medium placeholder:text-slate-400 outline-none focus:border-blue-600">
                        </div>
                        <div>
                            <label class="block text-base font-bold text-slate-800 mb-2">💓 ชีพจร (ครั้ง/นาที)</label>
                            <input type="number" id="pulse" placeholder="72" class="w-full border-2 border-slate-300 rounded-2xl p-3.5 text-base sm:text-lg font-medium placeholder:text-slate-400 outline-none focus:border-blue-600">
                        </div>
                        <div>
                            <label class="block text-base font-bold text-slate-800 mb-2">🩸 น้ำตาล (FBS)</label>
                            <input type="number" id="fbs" placeholder="100" class="w-full border-2 border-slate-300 rounded-2xl p-3.5 text-base sm:text-lg font-medium placeholder:text-slate-400 outline-none focus:border-blue-600">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8 bg-slate-50 p-5 rounded-2xl border border-slate-200">
                        <div>
                            <label class="block text-base font-bold text-slate-800 mb-2">🚬 การสูบบุหรี่</label>
                            <select id="smoking" class="w-full border-2 border-slate-300 rounded-2xl p-3.5 bg-white text-base text-slate-900 font-medium outline-none">
                                <option value="ไม่สูบ">ไม่สูบ</option>
                                <option value="สูบบุหรี่เป็นครั้งคราว">สูบบุหรี่เป็นครั้งคราว</option>
                                <option value="สูบเป็นประจำ">สูบเป็นประจำ</option>
                                <option value="เลิกสูบแล้ว">เลิกสูบแล้ว</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-base font-bold text-slate-800 mb-2">🍷 การดื่มสุรา</label>
                            <select id="drinking" class="w-full border-2 border-slate-300 rounded-2xl p-3.5 bg-white text-base text-slate-900 font-medium outline-none">
                                <option value="ไม่ดื่ม">ไม่ดื่ม</option>
                                <option value="ดื่มเป็นครั้งคราว">ดื่มเป็นครั้งคราว</option>
                                <option value="ดื่มเป็นประจำ">ดื่มเป็นประจำ</option>
                                <option value="เลิกดื่มแล้ว">เลิกดื่มแล้ว</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row justify-end gap-4 pt-4 border-t">
                        <button type="reset" onclick="clearAutoFillFields()" class="w-full sm:w-auto bg-slate-200 text-slate-800 px-6 py-4 rounded-2xl hover:bg-slate-300 transition text-base font-bold cursor-pointer">
                            🔄 ล้างข้อมูล
                        </button>
                        <button type="submit" id="btnSubmit" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-4 rounded-2xl transition shadow-lg text-lg font-bold flex items-center justify-center gap-2 cursor-pointer">
                            💾 บันทึกข้อมูลเข้า Cloud
                        </button>
                    </div>
                </div>
            </form>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
