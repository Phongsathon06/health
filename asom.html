<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกข้อมูลสุขภาพชุมชน (อสม.)</title>

    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: linear-gradient(135deg, #f0f4f8, #d9e2ec, #bcccdc);
            background-size: 300% 300%;
            animation: bgAnimation 15s ease infinite;
        }
        @keyframes bgAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="min-h-screen text-slate-900 pb-12">

    <div class="max-w-3xl mx-auto px-4 py-6">
        <!-- Header -->
        <header class="bg-white/90 backdrop-blur-md rounded-3xl shadow-md border border-slate-200/80 p-6 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold text-emerald-700">🏥 ระบบบันทึกข้อมูลสุขภาพ อสม.</h1>
                <p class="text-xs text-slate-500 mt-0.5">รอบเดือน: <span id="activeMonthDisplay" class="font-bold text-blue-600">กำลังโหลด...</span></p>
            </div>
            <div>
                <a href="nurse.html" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-2xl text-xs font-bold transition shadow-sm">
                    🔒 โซนพยาบาล
                </a>
            </div>
        </header>

        <!-- ฟอร์มบันทึกข้อมูล -->
        <main id="healthForm" class="bg-white/90 backdrop-blur-md rounded-3xl shadow-md border border-slate-200/80 p-6 sm:p-8">
            <form onsubmit="saveData(event)" class="space-y-5">
                
                <!-- เลือกหมู่บ้านและรายชื่อ -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">🏘️ เลือกหมู่ที่ *</label>
                        <select id="selectVillage" onchange="filterPatientsByVillage()" class="w-full border-2 border-slate-300 rounded-2xl p-3 bg-white text-sm font-medium outline-none focus:border-emerald-600">
                            <option value="" disabled selected>-- 🏘️ กำลังโหลดข้อมูลหมู่... --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">👤 เลือกชื่อ - นามสกุล *</label>
                        <select id="selectPatient" onchange="autoFillPatientData()" disabled class="w-full border-2 border-slate-300 rounded-2xl p-3 bg-white text-sm font-medium outline-none focus:border-emerald-600 disabled:bg-slate-100">
                            <option value="" disabled selected>-- 👤 กรุณาเลือกหมู่ก่อน --</option>
                        </select>
                    </div>
                </div>

                <!-- ข้อมูลอัตโนมัติ -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-50/80 p-4 rounded-2xl border border-slate-200">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500">🪪 เลขบัตรประชาชน (PID)</label>
                        <input type="text" id="idCard" readonly class="w-full bg-transparent text-sm font-semibold text-slate-800 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500">🎂 อายุ (ปี)</label>
                        <input type="text" id="age" readonly class="w-full bg-transparent text-sm font-semibold text-slate-800 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500">📍 ที่อยู่ (หมู่/ตำบล)</label>
                        <input type="text" id="villageAndSubdistrict" readonly class="w-full bg-transparent text-sm font-semibold text-slate-800 outline-none">
                    </div>
                    <div class="sm:col-span-3">
                        <label class="block text-[11px] font-bold text-slate-500">🏠 บ้านเลขที่</label>
                        <input type="text" id="houseNo" readonly class="w-full bg-transparent text-sm font-semibold text-slate-800 outline-none">
                    </div>
                </div>

                <!-- ช่องกรอกข้อมูลสุขภาพ -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">⚖️ น้ำหนัก (กก.) *</label>
                        <input type="number" step="0.1" id="weight" placeholder="เช่น 60.5" required class="w-full border-2 border-slate-300 rounded-2xl p-3 text-sm outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">📏 ส่วนสูง (ซม.) *</label>
                        <input type="number" id="height" placeholder="เช่น 170" required class="w-full border-2 border-slate-300 rounded-2xl p-3 text-sm outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">❤️ ความดัน ครั้งที่ 1 (BP1) *</label>
                        <input type="text" id="bp1" placeholder="เช่น 120/80" required class="w-full border-2 border-slate-300 rounded-2xl p-3 text-sm outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">💓 ความดัน ครั้งที่ 2 (BP2) *</label>
                        <input type="text" id="bp2" placeholder="เช่น 120/80" required class="w-full border-2 border-slate-300 rounded-2xl p-3 text-sm outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">🩺 ชีพจร (ครั้ง/นาที) *</label>
                        <input type="number" id="pulse" placeholder="เช่น 75" required class="w-full border-2 border-slate-300 rounded-2xl p-3 text-sm outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">🩸 น้ำตาลในเลือด (FBS)</label>
                        <input type="text" id="fbs" placeholder="เช่น 100 (หากไม่ได้ตรวจปล่อยว่างไว้)" class="w-full border-2 border-slate-300 rounded-2xl p-3 text-sm outline-none focus:border-emerald-600">
                    </div>
                </div>

                <!-- พฤติกรรมสุขภาพ -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">🚬 สูบบุหรี่</label>
                        <select id="smoking" class="w-full border-2 border-slate-300 rounded-2xl p-3 bg-white text-sm font-medium outline-none">
                            <option value="ไม่สูบ">ไม่สูบ</option>
                            <option value="สูบเป็นครั้งคราว">สูบเป็นครั้งคราว</option>
                            <option value="สูบเป็นประจำ">สูบเป็นประจำ</option>
                            <option value="เลิกสูบแล้ว">เลิกสูบแล้ว</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">🍺 ดื่มสุรา</label>
                        <select id="drinking" class="w-full border-2 border-slate-300 rounded-2xl p-3 bg-white text-sm font-medium outline-none">
                            <option value="ไม่ดื่ม">ไม่ดื่ม</option>
                            <option value="ดื่มเป็นครั้งคราว">ดื่มเป็นครั้งคราว</option>
                            <option value="ดื่มเป็นประจำ">ดื่มเป็นประจำ</option>
                            <option value="เลิกดื่มแล้ว">เลิกดื่มแล้ว</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="btnSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-bold transition shadow-md cursor-pointer text-base">
                    💾 บันทึกข้อมูลเข้า Cloud
                </button>
            </form>
        </main>
    </div>

    <script>
        // ฟังก์ชันเสริมใน script.js สำหรับเติมอิโมจิใน dropdown รายชื่อและหมู่บ้านอัตโนมัติ
        document.addEventListener("DOMContentLoaded", () => {
            const originalPopulate = window.populateVillageDropdown;
            if (window.populateVillageDropdown) {
                window.populateVillageDropdown = function() {
                    originalPopulate();
                    const villageSelect = document.getElementById('selectVillage');
                    if (villageSelect) {
                        for (let opt of villageSelect.options) {
                            if (!opt.text.includes("🏘️") && !opt.disabled) {
                                opt.text = "🏘️ " + opt.text;
                            }
                        }
                    }
                };
            }

            const originalFilter = window.filterPatientsByVillage;
            if (window.filterPatientsByVillage) {
                window.filterPatientsByVillage = function() {
                    originalFilter();
                    const patientSelect = document.getElementById('selectPatient');
                    if (patientSelect) {
                        for (let opt of patientSelect.options) {
                            if (!opt.text.includes("👤") && !opt.disabled) {
                                opt.text = "👤 " + opt.text;
                            }
                        }
                    }
                };
            }
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
